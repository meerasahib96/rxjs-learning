<div class="container">
    <form class="form" [formGroup]="myForm" (ngSubmit)="submitForm()">
        <div class="row">
            <div class="col">
                <label for="name">Name:</label>
                <input id="name" formControlName="name" type="text" />
            </div>
            <div class="col">
                <div class="form-check">
                    <input id="subscribe" formControlName="subscribe" type="checkbox" class="form-check-input" />
                    <label for="subscribe" class="form-check-label">Subscribe to newsletter</label>
                </div>
            </div>
            <div class="col">
                <label class="form-label">Email</label>
                <input formControlName="email" type="email" class="form-control" />
                <div *ngIf="myForm.get('email')?.invalid && myForm.get('email')?.touched" class="text-danger">
                    <small *ngIf="myForm.get('email')?.errors?.['required']">Email is required.</small>
                    <small *ngIf="myForm.get('email')?.errors?.['email']">Invalid email format.</small>
                </div>
            </div>
            <div class="col">
                <label for="password">Password:</label>
                <input id="password" formControlName="password" type="password" />
            </div>
            <div class="col">
                <label for="confirmPassword">Confirm Password:</label>
                <input id="confirmPassword" formControlName="confirmPassword" type="password" />
                <div *ngIf="myForm.errors?.['passwordMismatch'] && myForm.get('confirmPassword')?.touched" class="text-danger">
                    <small>Passwords do not match.</small>
                </div>
        </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3" [disabled]="myForm.invalid">Submit</button>
    </form>
</div>
